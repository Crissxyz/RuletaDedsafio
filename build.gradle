plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.maincranachito.ruleta'
version = '1.0.0'
base {
    archivesName = 'ruleta'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods { ruleta { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.0.28'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version: '1.21.1', forge_version: '52.0.28',
                             mod_id: 'ruleta', mod_name: 'Ruleta', mod_license: 'MIT',
                             mod_version: project.version, mod_authors: 'maincranachito',
                             mod_description: 'Ruleta animada sincronizada para todos los jugadores.']
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
